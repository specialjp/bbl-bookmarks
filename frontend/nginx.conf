server {
  listen 80;

  # Same-origin API (matches VITE_API_BASE_URL="") — no CORS anywhere.
  location /api/ {
    proxy_pass http://backend:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # SPA fallback — without this, /callback 404s in production and the
  # Auth0 redirect dies. The single most-missed line in this setup.
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
